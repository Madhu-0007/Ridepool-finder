{% extends 'base.html' %}
{% block content %}
<div class="auth-page">
  <!-- Floating vehicles -->
  <div class="moving-car-container" style="bottom: 15%; opacity: 0.9;">
    <div class="moving-car">
      <svg viewBox="0 0 100 40" xmlns="http://www.w3.org/2000/svg" class="car-svg">
        <defs>
          <linearGradient id="carGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#FF8C69;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#E86B4F;stop-opacity:1" />
          </linearGradient>
        </defs>
        <path d="M10,30 L85,30 C88,30 90,28 90,25 L90,18 C90,15 88,14 85,13 L65,13 L55,5 C52,2 48,2 45,2 L25,2 C22,2 20,4 20,7 L15,13 L10,13 C7,13 5,15 5,18 L5,25 C5,28 7,30 10,30 Z" fill="url(#carGradient)" stroke="#1C2B3A" stroke-width="1.2" />
        <path d="M22,13 L43,13 L43,6 C43,4 41,3 39,3 L25,3 C23,3 22,4 22,6 Z" fill="#2C3E50" opacity="0.8" />
        <path d="M46,13 L62,13 L54,6 C53,4 51,3 49,3 L46,3 Z" fill="#2C3E50" opacity="0.8" />
        <rect x="82" y="16" width="6" height="4" rx="1" fill="#FFD700" />
        <circle cx="22" cy="30" r="6" fill="#1C2B3A" />
        <circle cx="22" cy="30" r="3" fill="#BDC3C7" />
        <circle cx="73" cy="30" r="6" fill="#1C2B3A" />
        <circle cx="73" cy="30" r="3" fill="#BDC3C7" />
      </svg>
    </div>
  </div>

  <div class="moving-car-container" style="bottom: 35%; opacity: 0.85;">
    <div class="moving-bike">
      <svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg" class="bike-svg">
        <circle cx="30" cy="55" r="14" fill="none" stroke="#2C3E50" stroke-width="5"/>
        <circle cx="30" cy="55" r="4" fill="#7F8C8D"/>
        <circle cx="90" cy="55" r="14" fill="none" stroke="#2C3E50" stroke-width="5"/>
        <circle cx="90" cy="55" r="4" fill="#7F8C8D"/>
        <path d="M30,55 L50,30 L85,30 L90,55" fill="none" stroke="#F5A623" stroke-width="6" stroke-linecap="round"/>
        <path d="M50,30 L60,15 L90,15" fill="none" stroke="#2C3E50" stroke-width="4" stroke-linecap="round"/>
        <rect x="45" y="25" width="20" height="8" rx="2" fill="#E67E22" />
      </svg>
    </div>
  </div>

  <div class="moving-car-container" style="top: 15%; opacity: 0.8;">
    <div class="moving-scooty">
      <svg viewBox="0 0 100 70" xmlns="http://www.w3.org/2000/svg" class="scooty-svg">
        <path d="M15,55 L35,55 L40,35 C40,32 38,30 35,30 L20,30 C17,30 15,32 15,35 Z" fill="#3498DB" stroke="#1C2B3A" stroke-width="1.5"/>
        <circle cx="20" cy="55" r="10" fill="#2C3E50"/>
        <circle cx="20" cy="55" r="4" fill="#95A5A6"/>
        <path d="M35,55 L85,55 L80,35 C80,32 78,30 75,30 L40,30" fill="#2980B9" stroke="#1C2B3A" stroke-width="1.5"/>
        <circle cx="80" cy="55" r="10" fill="#2C3E50"/>
        <circle cx="80" cy="55" r="4" fill="#95A5A6"/>
        <rect x="45" y="45" width="30" height="10" rx="2" fill="#34495E" />
      </svg>
    </div>
  </div>

  <!-- Floating particles -->
  <div class="particle particle-1"></div>
  <div class="particle particle-2"></div>
  <div class="particle particle-3"></div>
  <div class="particle particle-4"></div>
  <div class="particle particle-5"></div>
  <div class="particle particle-6"></div>

  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">🚗</div>
      <div class="auth-logo-text">Ride<span>Pool</span></div>
    </div>

    <h2 class="auth-title">Welcome Back</h2>
    <p class="auth-subtitle">Sign in to manage your rides and requests</p>

    <form action="{{ url_for('login') }}" method="post" class="auth-form">
      <div class="auth-input-group">
        <div class="auth-input-icon">👤</div>
        <input type="text" name="username" id="login-username" placeholder="Username" required autocomplete="username" />
        <label for="login-username">Username</label>
        <div class="auth-input-line"></div>
      </div>

      <div class="auth-input-group">
        <div class="auth-input-icon">🔒</div>
        <input type="password" name="password" id="login-password" placeholder="Password" required autocomplete="current-password" />
        <label for="login-password">Password</label>
        <div class="auth-input-line"></div>
      </div>

      <button type="submit" class="auth-btn" id="login-submit-btn">
        <span class="auth-btn-text">Sign In</span>
        <span class="auth-btn-icon">→</span>
      </button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="{{ url_for('register') }}">Create one</a>
    </div>
  </div>
</div>
{% endblock %}
