{% extends 'base.html' %}
{% block content %}
<div class="auth-page">
  <!-- Floating vehicles -->
  <div class="moving-car-container" style="bottom: 15%; opacity: 0.8;">
    <div class="moving-car">
      <svg viewBox="0 0 100 40" xmlns="http://www.w3.org/2000/svg" class="car-svg">
        <path d="M10,30 L85,30 C88,30 90,28 90,25 L90,18 C90,15 88,14 85,13 L65,13 L55,5 C52,2 48,2 45,2 L25,2 C22,2 20,4 20,7 L15,13 L10,13 C7,13 5,15 5,18 L5,25 C5,28 7,30 10,30 Z" fill="#E86B4F" stroke="#1C2B3A" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M22,13 L43,13 L43,5 L26,5 Z" fill="#1C2B3A" />
        <path d="M46,13 L62,13 L54,5 L46,5 Z" fill="#1C2B3A" />
        <circle cx="22" cy="30" r="5" fill="#1C2B3A" />
        <circle cx="73" cy="30" r="5" fill="#1C2B3A" />
      </svg>
    </div>
  </div>

  <div class="moving-car-container" style="bottom: 35%; opacity: 0.6;">
    <div class="moving-bike">
      <svg viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg" class="bike-svg">
        <circle cx="30" cy="45" r="12" fill="none" stroke="#1C2B3A" stroke-width="4"/>
        <circle cx="70" cy="45" r="12" fill="none" stroke="#1C2B3A" stroke-width="4"/>
        <path d="M30,45 L45,25 L70,25" fill="none" stroke="#F5A623" stroke-width="4"/>
        <path d="M45,25 L55,10 L75,10" fill="none" stroke="#1C2B3A" stroke-width="3"/>
      </svg>
    </div>
  </div>

  <div class="moving-car-container" style="top: 15%; opacity: 0.5;">
    <div class="moving-scooty">
      <svg viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg" class="scooty-svg">
        <path d="M20,50 L40,50 L45,30 L30,30 Z" fill="#E86B4F" stroke="#1C2B3A" stroke-width="2"/>
        <circle cx="25" cy="50" r="8" fill="#1C2B3A"/>
        <circle cx="75" cy="50" r="8" fill="#1C2B3A"/>
        <path d="M40,50 L80,50 L75,30 L60,30 Z" fill="#F5A623" stroke="#1C2B3A" stroke-width="2"/>
      </svg>
    </div>
  </div>

  <!-- Floating particles -->
  <div class="particle particle-1"></div>
  <div class="particle particle-2"></div>
  <div class="particle particle-3"></div>
  <div class="particle particle-4"></div>
  <div class="particle particle-5"></div>
  <div class="particle particle-6"></div>

  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">🚗</div>
      <div class="auth-logo-text">Ride<span>Pool</span></div>
    </div>

    <h2 class="auth-title">Welcome Back</h2>
    <p class="auth-subtitle">Sign in to manage your rides and requests</p>

    <form action="{{ url_for('login') }}" method="post" class="auth-form">
      <div class="auth-input-group">
        <div class="auth-input-icon">👤</div>
        <input type="text" name="username" id="login-username" placeholder="Username" required autocomplete="username" />
        <label for="login-username">Username</label>
        <div class="auth-input-line"></div>
      </div>

      <div class="auth-input-group">
        <div class="auth-input-icon">🔒</div>
        <input type="password" name="password" id="login-password" placeholder="Password" required autocomplete="current-password" />
        <label for="login-password">Password</label>
        <div class="auth-input-line"></div>
      </div>

      <button type="submit" class="auth-btn" id="login-submit-btn">
        <span class="auth-btn-text">Sign In</span>
        <span class="auth-btn-icon">→</span>
      </button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="{{ url_for('register') }}">Create one</a>
    </div>
  </div>
</div>
{% endblock %}
